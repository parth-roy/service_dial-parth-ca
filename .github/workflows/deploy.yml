name: Deploy Service Dial to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production Droplet
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            APP_DIR="/var/www/service_dial"
            git config --global --add safe.directory $APP_DIR

            cd $APP_DIR
            git fetch origin main
            git reset --hard origin/main

            echo "Clearing stale build artifacts and Next.js type cache..."
            rm -rf .next

            echo "Installing dependencies..."
            npm install --production=false

            echo "Type-checking application before build..."
            npx tsc --noEmit

            echo "Stopping old PM2 process & freeing port 3000..."
            pm2 delete service_dial || true
            if command -v fuser >/dev/null 2>&1; then
              fuser -k 3000/tcp >/dev/null 2>&1 || true
            fi

            echo "Building application cleanly..."
            npm run build

            echo "Starting fresh process with PM2..."
            pm2 start ecosystem.config.cjs --update-env
            pm2 startup systemd -u root --hp /root || true
            pm2 save

            systemctl reload nginx

            echo "Verifying origin /sitemap.xml..."
            for i in 1 2 3 4 5; do
              COUNT=$(curl -s http://127.0.0.1:3000/sitemap.xml | grep -c "<url>" || true)
              if [ "$COUNT" -gt 0 ]; then
                echo "Origin /sitemap.xml active with $COUNT URLs"
                break
              fi
              sleep 2
            done
            echo "Deployment completed successfully!"
